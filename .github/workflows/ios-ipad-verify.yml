name: iOS iPhone verification

on:
  push:
    branches:
      - agent/ipad-native-verification
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-iphone-verification
  cancel-in-progress: true

jobs:
  verify-iphone:
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web-src

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.13"
          cache: npm
          cache-dependency-path: web-src/package-lock.json

      - name: Show Xcode and simulator inventory
        run: |
          xcodebuild -version
          xcode-select -p
          xcrun simctl list runtimes available
          xcrun simctl list devicetypes | grep -E "iPad Pro 13-inch|iPad Pro \(12.9-inch\)" || true

      - name: Install dependencies
        run: npm ci

      - name: Run web tests
        run: npm test

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor iOS project
        run: npx cap sync ios

      - name: Select an available iPhone simulator
        id: simulator
        run: |
          set -euo pipefail
          DEVICE_UDID=$(xcrun simctl list devices available | sed -nE \
            's/.*iPad Pro 13-inch.*\(([0-9A-F-]{36})\).*/\1/p' | head -n 1)

          if [ -z "$DEVICE_UDID" ]; then
            DEVICE_UDID=$(xcrun simctl list devices available | sed -nE \
              's/.*iPad Pro \(12\.9-inch\).*(\([0-9A-F-]{36}\)).*/\1/p' | tr -d '()' | head -n 1)
          fi

          if [ -z "$DEVICE_UDID" ]; then
            echo "::error::No available iPhone simulator was found"
            xcrun simctl list devices available
            exit 1
          fi

          echo "udid=$DEVICE_UDID" >> "$GITHUB_OUTPUT"
          echo "Using iPhone simulator: $DEVICE_UDID"

      - name: Build for iPhone Simulator
        env:
          DEVICE_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "id=$DEVICE_UDID" \
            -derivedDataPath "$RUNNER_TEMP/roku-rhythm-iphone-build" \
            build

      - name: Install and launch on iPhone Simulator
        env:
          DEVICE_UDID: ${{ steps.simulator.outputs.udid }}
          APP_BUNDLE_ID: com.comodoidealab.rokurhythm
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/roku-rhythm-ipad-build/Build/Products/Debug-iphonesimulator/App.app"
          test -d "$APP_PATH"

          xcrun simctl boot "$DEVICE_UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$DEVICE_UDID" -b
          xcrun simctl install "$DEVICE_UDID" "$APP_PATH"
          xcrun simctl launch "$DEVICE_UDID" "$APP_BUNDLE_ID"
          sleep 8

      - name: Capture launched iPhone app
        if: always()
        env:
          DEVICE_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/roku-rhythm-iphone-artifacts"
          xcrun simctl io "$DEVICE_UDID" screenshot \
            "$RUNNER_TEMP/roku-rhythm-ipad-artifacts/roku-rhythm-iphone-launch.png"
          xcrun simctl spawn "$DEVICE_UDID" log show \
            --last 2m --style compact \
            > "$RUNNER_TEMP/roku-rhythm-ipad-artifacts/roku-rhythm-iphone-runtime.log" || true

      - name: Upload iPhone verification artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: roku-rhythm-iphone-verification-${{ github.run_number }}
          path: ${{ runner.temp }}/roku-rhythm-ipad-artifacts
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
