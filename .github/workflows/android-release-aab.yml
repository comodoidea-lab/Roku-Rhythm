name: Android signed AAB

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: Google Play version code
        required: true
        default: "1"
        type: string
      version_name:
        description: User-visible version name
        required: true
        default: "1.0"
        type: string

permissions:
  contents: read

concurrency:
  group: android-release-aab-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-signed-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    defaults:
      run:
        working-directory: web-src

    env:
      ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/roku-rhythm-upload.p12
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_VERSION_CODE: ${{ inputs.version_code }}
      ANDROID_VERSION_NAME: ${{ inputs.version_name }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: web-src/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          missing=0
          for variable in \
            ANDROID_KEYSTORE_BASE64 \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_ALIAS \
            ANDROID_KEY_PASSWORD
          do
            if [[ -z "${!variable:-}" ]]; then
              echo "::error::Missing repository secret: ${variable}"
              missing=1
            fi
          done
          exit "${missing}"

      - name: Restore upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" \
            | base64 --decode > "${ANDROID_KEYSTORE_PATH}"
          chmod 600 "${ANDROID_KEYSTORE_PATH}"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build PWA
        run: npm run build

      - name: Sync Android project
        run: npx cap sync android

      - name: Build signed release AAB
        run: ./android/gradlew -p android bundleRelease --no-daemon

      - name: Verify AAB signature
        run: >-
          jarsigner -verify -certs
          android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload signed AAB
        uses: actions/upload-artifact@v6
        with:
          name: roku-rhythm-signed-aab-v${{ inputs.version_code }}
          path: web-src/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Remove restored upload keystore
        if: always()
        run: rm -f "${ANDROID_KEYSTORE_PATH}"
