name: iOS TestFlight

on:
  workflow_dispatch:
    inputs:
      upload_to_testflight:
        description: Upload the signed IPA to TestFlight
        required: true
        default: true
        type: boolean
      build_number:
        description: App Store build number (must be greater than the current App Store build)
        required: true
        default: "12"
        type: string
      marketing_version:
        description: App Store version
        required: true
        default: "1.0.1"
        type: string

permissions:
  contents: read

concurrency:
  group: ios-testflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-upload:
    runs-on: macos-26
    timeout-minutes: 35
    defaults:
      run:
        working-directory: web-src
    env:
      APP_BUNDLE_ID: com.comodoidealab.rokurhythm
      ARCHIVE_PATH: ${{ github.workspace }}/web-src/RokuRhythm.xcarchive
      EXPORT_PATH: ${{ github.workspace }}/web-src/testflight-export
      KEYCHAIN_PATH: ${{ github.workspace }}/web-src/app-signing.keychain-db
      PROFILE_PATH: ${{ github.workspace }}/web-src/RokuRhythm.mobileprovision
      BUILD_NUMBER: ${{ inputs.build_number }}
      MARKETING_VERSION: ${{ inputs.marketing_version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.13"
          cache: npm
          cache-dependency-path: web-src/package-lock.json

      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcode-select -p

      - name: Verify signing secrets
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          API_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64 }}
          UPLOAD_TO_TESTFLIGHT: ${{ inputs.upload_to_testflight }}
        run: |
          missing=0
          if ! [[ "$BUILD_NUMBER" =~ ^[0-9]+$ ]] || [ "$BUILD_NUMBER" -le 11 ]; then
            echo "::error::build_number must be numeric and greater than 11 (received: $BUILD_NUMBER)"
            missing=1
          fi
          if ! [[ "$MARKETING_VERSION" =~ ^[0-9]+(\.[0-9]+){1,2}$ ]]; then
            echo "::error::marketing_version must be a semantic version (received: $MARKETING_VERSION)"
            missing=1
          fi
          for name in APPLE_TEAM_ID CERTIFICATE_BASE64 CERTIFICATE_PASSWORD PROFILE_BASE64; do
            if [ -z "${!name}" ]; then
              echo "::error::Required GitHub Actions secret is missing: $name"
              missing=1
            fi
          done
          if [ "$UPLOAD_TO_TESTFLIGHT" = "true" ]; then
            for name in API_KEY_ID API_ISSUER_ID API_PRIVATE_KEY_BASE64; do
              if [ -z "${!name}" ]; then
                echo "::error::TestFlight upload secret is missing: $name"
                missing=1
              fi
            done
          fi
          exit "$missing"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor iOS project
        run: npx cap sync ios

      - name: Install distribution certificate and provisioning profile
        env:
          CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_TEMP_KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/RokuRhythm.p12"
          PROFILE_PLIST="$RUNNER_TEMP/RokuRhythm-profile.plist"
          EFFECTIVE_KEYCHAIN_PASSWORD="${KEYCHAIN_PASSWORD:-$(uuidgen)}"

          printf '%s' "$CERTIFICATE_BASE64" | /usr/bin/base64 --decode > "$CERTIFICATE_PATH"
          printf '%s' "$PROFILE_BASE64" | /usr/bin/base64 --decode > "$PROFILE_PATH"

          security create-keychain -p "$EFFECTIVE_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$EFFECTIVE_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$EFFECTIVE_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$PROFILE_PLIST")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" "$PROFILE_PLIST")
          PROFILE_APP_ID=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" "$PROFILE_PLIST")
          PROFILE_BUNDLE_ID=${PROFILE_APP_ID#*.}
          if [ "$PROFILE_BUNDLE_ID" != "$APP_BUNDLE_ID" ]; then
            echo "::error::Provisioning profile is for $PROFILE_BUNDLE_ID, expected $APP_BUNDLE_ID"
            exit 1
          fi
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"

      - name: Archive signed app
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath "$ARCHIVE_PATH" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$APP_BUNDLE_ID" \
            TARGETED_DEVICE_FAMILY=1 \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            clean archive

      - name: Verify archived version and build number
        run: |
          ARCHIVED_APP_PLIST="$ARCHIVE_PATH/Products/Applications/App.app/Info.plist"
          test -f "$ARCHIVED_APP_PLIST"
          ACTUAL_MARKETING_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$ARCHIVED_APP_PLIST")
          if [ "$ACTUAL_MARKETING_VERSION" != "$MARKETING_VERSION" ]; then
            echo "::error::Archive CFBundleShortVersionString=$ACTUAL_MARKETING_VERSION but expected $MARKETING_VERSION"
            exit 1
          fi
          echo "Verified archive CFBundleShortVersionString=$ACTUAL_MARKETING_VERSION"
          ACTUAL_BUILD_NUMBER=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$ARCHIVED_APP_PLIST")
          if [ "$ACTUAL_BUILD_NUMBER" != "$BUILD_NUMBER" ]; then
            echo "::error::Archive CFBundleVersion=$ACTUAL_BUILD_NUMBER but expected $BUILD_NUMBER"
            exit 1
          fi
          echo "Verified archive CFBundleVersion=$ACTUAL_BUILD_NUMBER"

      - name: Create App Store export options
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          EXPORT_OPTIONS="$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c "Clear dict" "$EXPORT_OPTIONS"
          /usr/libexec/PlistBuddy -c "Add :method string app-store-connect" "$EXPORT_OPTIONS"
          /usr/libexec/PlistBuddy -c "Add :teamID string $APPLE_TEAM_ID" "$EXPORT_OPTIONS"
          /usr/libexec/PlistBuddy -c "Add :signingStyle string manual" "$EXPORT_OPTIONS"
          /usr/libexec/PlistBuddy -c "Add :stripSwiftSymbols bool true" "$EXPORT_OPTIONS"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles dict" "$EXPORT_OPTIONS"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:$APP_BUNDLE_ID string $PROFILE_NAME" "$EXPORT_OPTIONS"
          echo "EXPORT_OPTIONS=$EXPORT_OPTIONS" >> "$GITHUB_ENV"

      - name: Export signed IPA
        run: |
          xcodebuild \
            -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist "$EXPORT_OPTIONS"

          IPA_PATH=$(find "$EXPORT_PATH" -maxdepth 1 -name '*.ipa' -print -quit)
          test -n "$IPA_PATH"
          IPA_MARKETING_VERSION=$(unzip -p "$IPA_PATH" 'Payload/*.app/Info.plist' | plutil -extract CFBundleShortVersionString raw -o - -)
          if [ "$IPA_MARKETING_VERSION" != "$MARKETING_VERSION" ]; then
            echo "::error::IPA CFBundleShortVersionString=$IPA_MARKETING_VERSION but expected $MARKETING_VERSION"
            exit 1
          fi
          echo "Verified IPA CFBundleShortVersionString=$IPA_MARKETING_VERSION"
          IPA_BUILD_NUMBER=$(unzip -p "$IPA_PATH" 'Payload/*.app/Info.plist' | plutil -extract CFBundleVersion raw -o - -)
          if [ "$IPA_BUILD_NUMBER" != "$BUILD_NUMBER" ]; then
            echo "::error::IPA CFBundleVersion=$IPA_BUILD_NUMBER but expected $BUILD_NUMBER"
            exit 1
          fi
          echo "Verified IPA CFBundleVersion=$IPA_BUILD_NUMBER"
          mkdir -p testflight-output
          cp "$IPA_PATH" "testflight-output/Roku-Rhythm-$BUILD_NUMBER.ipa"
          shasum -a 256 "testflight-output/Roku-Rhythm-$BUILD_NUMBER.ipa" > "testflight-output/Roku-Rhythm-$BUILD_NUMBER.ipa.sha256"
          echo "IPA_PATH=$IPA_PATH" >> "$GITHUB_ENV"

      - name: Install App Store Connect API key
        if: ${{ inputs.upload_to_testflight }}
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64 }}
        run: |
          API_KEY_DIRECTORY="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$API_KEY_DIRECTORY"
          printf '%s' "$API_PRIVATE_KEY_BASE64" | /usr/bin/base64 --decode > "$API_KEY_DIRECTORY/AuthKey_${API_KEY_ID}.p8"
          chmod 600 "$API_KEY_DIRECTORY/AuthKey_${API_KEY_ID}.p8"

      - name: Validate signed IPA
        if: ${{ inputs.upload_to_testflight }}
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          xcrun altool \
            --validate-app \
            --file "$IPA_PATH" \
            --type ios \
            --apiKey "$API_KEY_ID" \
            --apiIssuer "$API_ISSUER_ID"

      - name: Upload to TestFlight
        if: ${{ inputs.upload_to_testflight }}
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          xcrun altool \
            --upload-app \
            --file "$IPA_PATH" \
            --type ios \
            --apiKey "$API_KEY_ID" \
            --apiIssuer "$API_ISSUER_ID"

      - name: Upload signed IPA artifact
        uses: actions/upload-artifact@v6
        with:
          name: roku-rhythm-testflight-${{ inputs.build_number }}
          path: |
            web-src/testflight-output/*.ipa
            web-src/testflight-output/*.sha256
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

      - name: Clean up signing material
        if: always()
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        run: |
          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8"
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID:-unused}.mobileprovision"
