name: Web source check

on:
  workflow_dispatch:
  push:
    branches:
      - codex/native-app
    paths:
      - "web-src/**"
      - ".github/workflows/web-src-check.yml"
  pull_request:
    paths:
      - "web-src/**"
      - ".github/workflows/web-src-check.yml"

permissions:
  contents: read

concurrency:
  group: web-src-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web-src

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: web-src/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build PWA
        run: npm run build
