name: Android signed APK

on:
  workflow_dispatch:
  push:
    branches:
      - codex/native-app
    paths:
      - "web-src/**"
      - ".github/workflows/android-debug.yml"

permissions:
  contents: read

concurrency:
  group: android-signed-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-signed-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: web-src

    env:
      ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/roku-rhythm-upload.p12
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_VERSION_CODE: ${{ github.run_number }}
      ANDROID_VERSION_NAME: 1.0.${{ github.run_number }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          missing=0
          for variable in \
            ANDROID_KEYSTORE_BASE64 \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_ALIAS \
            ANDROID_KEY_PASSWORD
          do
            if [[ -z "${!variable:-}" ]]; then
              echo "::error::Missing repository secret: ${variable}"
              missing=1
            fi
          done
          exit "${missing}"

      - name: Restore upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" \
            | base64 --decode > "${ANDROID_KEYSTORE_PATH}"
          chmod 600 "${ANDROID_KEYSTORE_PATH}"

      - name: Install dependencies
        run: npm ci

      - name: Build PWA
        run: npm run build

      - name: Sync Android project
        run: npx cap sync android

      - name: Build signed release APK
        run: ./android/gradlew -p android assembleRelease --no-daemon

      - name: Upload signed APK
        uses: actions/upload-artifact@v6
        with:
          name: roku-rhythm-signed-apk
          path: web-src/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Remove restored upload keystore
        if: always()
        run: rm -f "${ANDROID_KEYSTORE_PATH}"
