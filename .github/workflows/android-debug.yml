name: Android debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - codex/native-app
    paths:
      - "web-src/**"
      - ".github/workflows/android-debug.yml"

permissions:
  contents: read

concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: web-src

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm ci

      - name: Build native web bundle
        run: npm run build:native

      - name: Sync Android project
        run: npx cap sync android

      - name: Build debug APK
        run: ./android/gradlew -p android assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: roku-rhythm-debug-apk
          path: web-src/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
