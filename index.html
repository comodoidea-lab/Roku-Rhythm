<!doctype html>

    <style>
      :root {
        color-scheme: dark;

        color: #f8f7ff;
        background: #0b0b1f;

      * { box-sizing: border-box; }
      body { margin: 0; min-width: 320px; background: radial-gradient(circle at 15% 0%, #29327e, #0b0b1f 58%); }
      main { width: min(720px, 100%); margin: 0 auto; padding: 72px 24px 64px; }
      .mark { display: inline-flex; align-items: center; gap: 12px; color: #bde8ff; font-size: 13px; font-weight: 800; letter-spacing: .18em; }

      .card { margin-top: 48px; padding: 28px; border: 1px solid rgba(255,255,255,.16); border-radius: 24px; background: rgba(255,255,255,.08); box-shadow: 0 24px 70px rgba(0,0,0,.24); }
      .card h2 { margin: 0 0 12px; font-size: 20px; }
      .card p { margin: 0; color: #d8d7ea; line-height: 1.8; }
      nav { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 28px; }
      a { color: #fff; }
      nav a { display: inline-block; padding: 12px 16px; border-radius: 999px; background: #5b45e5; text-decoration: none; font-weight: 700; }
      nav a.secondary { background: rgba(255,255,255,.1); }

        <nav aria-label="Roku Rhythmの案内">
